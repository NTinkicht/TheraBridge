name: Refresh flow map

# Reads the CareBridge Figma file (read-only), updates site/data when the
# prototype changed, and publishes site/ to GitHub Pages.
on:
  workflow_dispatch: {}          # "Run workflow" button on the Actions tab
  schedule:
    - cron: "0 2 * * *"          # every day at 06:00 Dubai time (02:00 UTC)
  push:
    branches: [main]             # republish when the page itself is edited
    paths: ["site/**", ".github/workflows/refresh.yml"]

permissions:
  contents: write                # commit refreshed data
  pages: write
  id-token: write

concurrency:
  group: flowmap
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Read Figma (read-only)
        id: extract
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          FIGMA_FILE_KEY: ${{ vars.FIGMA_FILE_KEY }}
          FIGMA_PAGES: ${{ vars.FIGMA_PAGES }}
        run: node scripts/extract.mjs
      - name: Commit new data
        if: steps.extract.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          git commit -m "Refresh flow map from Figma"
          git push

  deploy:
    needs: refresh
    if: always() && needs.refresh.result != 'failure' && needs.refresh.result != 'cancelled'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}   # includes the data commit made above
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
