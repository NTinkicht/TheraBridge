<title>CareBridge V1 Flow Map</title>

<style>
/* Layout: header + tabs; journey view is list | graph | detail, stacking to one column on phones. */
:root {
  --bg: #F6F7F9; --surface: #FFFFFF; --raised: #EEF1F5; --line: #DCE1E8; --ink: #14213D; --muted: #4B566B; --faint: #6B7489;
  --accent: #0F5692; --accent-soft: #E8F0F8; --teal: #0A7385; --teal-soft: #E3F3F5; --identity: #4B2E82; --identity-soft: #F2EDFA;
  --ok: #1B7A4B; --ok-soft: #E8F5EE; --warn: #8A5300; --warn-soft: #FFF4E0; --bad: #B42318; --bad-soft: #FDECEA; --lock: #5B6475; --nav: #B7C0CC;
  --font: "IBM Plex Sans", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0D1226; --surface: #151B33; --raised: #1C2342; --line: #2A3256; --ink: #E9ECF5; --muted: #AAB3CB; --faint: #8B95B0;
  --accent: #7DB3E8; --accent-soft: #172A45; --teal: #5CCFDB; --teal-soft: #13394A; --identity: #B69BEB; --identity-soft: #2A2350;
  --ok: #6FD39C; --ok-soft: #173A2B; --warn: #F0C36B; --warn-soft: #2B2617; --bad: #FF9C8F; --bad-soft: #3A1F24; --lock: #A9B4C6; --nav: #3A4466; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0D1226; --surface: #151B33; --raised: #1C2342; --line: #2A3256; --ink: #E9ECF5; --muted: #AAB3CB; --faint: #8B95B0;
  --accent: #7DB3E8; --accent-soft: #172A45; --teal: #5CCFDB; --teal-soft: #13394A; --identity: #B69BEB; --identity-soft: #2A2350;
  --ok: #6FD39C; --ok-soft: #173A2B; --warn: #F0C36B; --warn-soft: #2B2617; --bad: #FF9C8F; --bad-soft: #3A1F24; --lock: #A9B4C6; --nav: #3A4466; color-scheme: dark }
* { box-sizing: border-box }
html, body { height: 100% }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font); margin: 0; padding-inline: 16px; padding-block: 0 }
[hidden] { display: none !important }
button, input, select { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.app { max-width: 1600px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; padding-block: 18px 32px; min-height: 100% }
header.top { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 20px }
.brand { display: flex; flex-direction: column; gap: 2px; min-width: 0 }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--teal) }
h1 { margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -.01em; text-wrap: balance }
.snapinfo { font-size: 13px; color: var(--muted) }
.spacer { flex: 1 }
.btn { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-weight: 500 }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface) }
.btn[disabled] { opacity: .55; cursor: not-allowed }
.btn.small { height: 32px; padding: 0 10px; font-size: 13px }
.notice { padding: 10px 14px; border-radius: 8px; background: var(--raised); color: var(--muted); font-size: 13px }
.notice.bad { background: var(--bad-soft); color: var(--bad) }
.notice.ok { background: var(--ok-soft); color: var(--ok) }
nav.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto }
nav.tabs button { border: 0; background: none; padding: 10px 14px; color: var(--muted); font-weight: 500; border-bottom: 2px solid transparent; white-space: nowrap }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--identity) }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px }
.stat b { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums }
.stat span { font-size: 12.5px; color: var(--muted) }
.lanes { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; align-items: start }
.lane { display: flex; flex-direction: column; gap: 10px; min-width: 0 }
.lane h2 { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted) }
.jcard { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px }
.jcard:hover { border-color: var(--accent) }
.jcard .t { font-weight: 600; font-size: 15px }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center }
.chip { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 11px; font-size: 12px; font-weight: 500; background: var(--raised); color: var(--muted); white-space: nowrap }
.chip.pass { background: var(--ok-soft); color: var(--ok) }
.chip.partial { background: var(--warn-soft); color: var(--warn) }
.chip.unsafe { background: var(--bad-soft); color: var(--bad) }
.chip.untestable { background: var(--accent-soft); color: var(--accent) }
.chip.h { font-family: var(--mono); font-size: 11.5px }
.meter { display: flex; gap: 12px; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; flex-wrap: wrap }
.meter b { color: var(--ink); font-weight: 600 }
.jview { display: grid; grid-template-columns: 240px minmax(0, 1fr) 340px; gap: 14px; align-items: start }
@media (max-width: 1180px) { .jview { grid-template-columns: minmax(0, 1fr) 320px } .jview .jlist { grid-column: 1 / -1; flex-direction: row; overflow-x: auto; padding-bottom: 4px } .jview .jlist button { min-width: 200px; flex: none } }
@media (max-width: 760px) { .jview { grid-template-columns: minmax(0, 1fr) } }
.jlist { display: flex; flex-direction: column; gap: 6px; min-width: 0 }
.jlist button { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; gap: 4px }
.jlist button[aria-pressed="true"] { border-color: var(--identity); background: var(--identity-soft) }
.jlist .role { font-size: 11.5px; color: var(--faint); text-transform: uppercase; letter-spacing: .05em }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; min-width: 0 }
.graphwrap { display: flex; flex-direction: column; min-width: 0 }
.gtools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line) }
.gtools label { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted) }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--muted); padding: 8px 12px; border-top: 1px solid var(--line) }
.legend span { display: inline-flex; align-items: center; gap: 6px }
.legend svg { flex: none }
.canvas { overflow: auto; height: min(68vh, 640px); min-height: 320px; position: relative }
svg.g { display: block }
.node rect { fill: var(--surface); stroke: var(--line); stroke-width: 1.2 }
.node.ext rect { fill: var(--raised); stroke-dasharray: 4 3 }
.node.orphan rect { stroke: var(--bad); stroke-dasharray: 3 3 }
.node.issue rect { stroke: var(--warn) }
.node.sel rect { stroke: var(--identity); stroke-width: 2.4 }
.node.cur rect { fill: var(--identity-soft); stroke: var(--identity); stroke-width: 2.4 }
.node.visited rect { fill: var(--teal-soft) }
.node.start rect { stroke: var(--teal); stroke-width: 2 }
.node text { fill: var(--ink); font-family: var(--font) }
.node .code { font-family: var(--mono); font-size: 11px; fill: var(--muted) }
.node .ttl { font-size: 12.5px; font-weight: 500 }
.node { cursor: pointer }
.e { fill: none; stroke-width: 1.6 }
.e.wired { stroke: var(--accent) }
.e.nav { stroke: var(--nav); stroke-width: 1 }
.e.protected { stroke: var(--lock); stroke-dasharray: 6 4 }
.e.server { stroke: var(--teal); stroke-dasharray: 2 3; stroke-width: 2 }
.e.missing { stroke: var(--bad); stroke-dasharray: 7 4 }
.e.example { stroke: var(--warn); stroke-width: 2 }
.detail { padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; max-height: 80vh; overflow: auto }
.detail h3 { margin: 0; font-size: 16px; font-weight: 600; text-wrap: balance }
.detail h4 { margin: 4px 0 0; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted) }
.kv { display: grid; grid-template-columns: 90px minmax(0, 1fr); gap: 4px 10px; font-size: 13px }
.kv dt { color: var(--muted) } .kv dd { margin: 0; overflow-wrap: anywhere }
.opts { display: flex; flex-direction: column; gap: 6px }
.opt { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 8px; align-items: start; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 10px; font-size: 13px }
.opt:hover { border-color: var(--accent) }
.opt small { display: block; color: var(--muted); font-size: 12px }
.opt.k-missing { border-color: var(--bad); background: var(--bad-soft) }
.opt.k-protected { background: var(--raised) }
.opt.k-server { border-style: dashed; border-color: var(--teal) }
.opt.k-example { border-color: var(--warn); background: var(--warn-soft) }
.dot { width: 10px; height: 10px; border-radius: 5px; margin-top: 4px }
.issue { padding: 8px 10px; border-radius: 8px; background: var(--warn-soft); color: var(--warn); font-size: 13px }
.issue.p0 { background: var(--bad-soft); color: var(--bad) }
.trail { display: flex; flex-wrap: wrap; gap: 4px; font-family: var(--mono); font-size: 11.5px; color: var(--muted) }
.trail span::after { content: "→"; margin-left: 4px } .trail span:last-child::after { content: "" }
a { color: var(--accent) }
.tablewrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px }
table { border-collapse: collapse; width: 100%; font-size: 13px }
th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top }
th { font-weight: 500; color: var(--muted); position: sticky; top: 0; background: var(--surface) }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums }
td code { font-family: var(--mono); font-size: 12px }
.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center }
.filters input[type="search"], .filters select { height: 36px; border: 1px solid var(--line); border-radius: 8px; padding: 0 10px; background: var(--surface) }
.filters input[type="search"] { width: min(320px, 100%) }
.diffgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; align-items: start }
.diffgrid ul { margin: 0; padding: 12px 16px 12px 30px; display: flex; flex-direction: column; gap: 4px; font-size: 13px }
.diffgrid h3 { margin: 0; padding: 12px 16px 0; font-size: 14px }
.empty { padding: 28px; text-align: center; color: var(--muted) }
.progress { height: 6px; border-radius: 3px; background: var(--raised); overflow: hidden }
.progress div { height: 6px; background: var(--teal); width: 0 }
@media (prefers-reduced-motion: no-preference) { .progress div { transition: width .3s } }
</style>
</head>

    <button role="tab" id="tab-changes" aria-selected="false" data-tab="changes" type="button">Changes</button>

  <section id="view-changes" role="tabpanel" aria-labelledby="tab-changes" hidden></section>
</div>

  } else p.appendChild(el("div", { class: "notice bad", text: "This screen is not in the latest extraction. It may have been deleted or recreated with a new ID." }));
  (ISSUES[id] || []).forEach(function (is) { p.appendChild(el("div", { class: "issue " + is[0], text: is[1] })); });
  var es = journeyEdges(j, m).filter(function (e) { return e.from === id; });
  var outside = (m.out[id] || []).filter(function (e) { return j.members.indexOf(e.to) < 0 && !e.nav; }).map(function (e) { return { from: e.from, to: e.to, kind: "wired", label: e.label + " (leaves this journey)", guard: "", d: [] }; });
  var navs = S.showNav ? [] : es.filter(function (e) { return e.kind === "nav"; });
  var choices = es.filter(function (e) { return S.showNav || e.kind !== "nav"; }).concat(outside);
  p.appendChild(el("h4", { text: S.walk ? "What can happen next" : "Leaving this screen" }));
  if (!choices.length) p.appendChild(el("div", { class: "notice", text: navs.length ? "Only navigation links leave this screen." : "Nothing leaves this screen: it is a dead end in the prototype." }));
  var opts = el("div", { class: "opts" });
  var order = { wired: 0, example: 1, protected: 2, server: 3, missing: 4, nav: 5 };
  choices.sort(function (a, b) { return order[a.kind] - order[b.kind]; }).forEach(function (e) {
    var tf = m.frames[e.to];
    var kindText = { wired: "Wired in Figma", nav: "Navigation", protected: "Protected action · stays locked in Figma", server: "Server decides", missing: "Missing in the design", example: "Example link into a success state" }[e.kind];
    var color = { wired: "var(--accent)", nav: "var(--nav)", protected: "var(--lock)", server: "var(--teal)", missing: "var(--bad)", example: "var(--warn)" }[e.kind];
    var b = el("button", { class: "opt k-" + e.kind, type: "button", onclick: function () { if (S.walk) { S.walk.cur = e.to; S.walk.trail.push(e.to); } S.sel = e.to; renderJourneys(); } }, [
      el("span", { class: "dot", style: "background:" + color, "aria-hidden": "true" }),
      el("span", null, [el("b", { text: e.label || "(unlabelled)" }), el("small", { text: kindText + " → " + (tf ? code(tf) + " " + tf.title : e.to) + (e.guard ? " · requires: " + e.guard : "") + (e.d.length ? " · " + e.d.join(", ") : "") })])
    ]);
    opts.appendChild(b);
  });
  p.appendChild(opts);
  return p;
}

/* ---------- rendering: screens ---------- */
var SF = { q: "", page: "", width: "", orphan: false };
function renderScreens() {
  var v = document.getElementById("view-screens"); v.innerHTML = "";
  var m = S.data; if (!m) { v.appendChild(el("div", { class: "panel empty", text: "No extraction yet." })); return; }
  var q = el("input", { type: "search", id: "sq", placeholder: "Search name, title or ID", value: SF.q, "aria-label": "Search screens" });
  var ps = el("select", { id: "sp", "aria-label": "Page" }, [el("option", { value: "", text: "All pages" })].concat(Object.keys(m.pages).map(function (p) { var o = el("option", { value: p, text: m.pages[p] }); if (SF.page === p) o.selected = true; return o; })));
  var ws = el("select", { id: "sw", "aria-label": "Width" }, [el("option", { value: "", text: "All widths" })].concat([320, 390, 768, 1024, 1440].map(function (w) { var o = el("option", { value: String(w), text: w + " px" }); if (SF.width === String(w)) o.selected = true; return o; })));
  var oc = el("input", { type: "checkbox", id: "so" }); oc.checked = SF.orphan;
  var bar = el("div", { class: "filters" }, [q, ps, ws, el("label", { for: "so", style: "display:inline-flex;gap:6px;align-items:center" }, [oc, "Only screens with no way in"])]);
  var tw = el("div", { class: "tablewrap", style: "margin-top:12px" });
  function draw() {
    var rows = Object.keys(m.frames).map(function (id) { return m.frames[id]; }).filter(function (f) {
      if (SF.page && f.page !== SF.page) return false; if (SF.width && String(f.w) !== SF.width) return false;
      if (SF.orphan && m.incoming[f.id]) return false;
      if (SF.q) { var s = (f.id + " " + f.name + " " + f.title).toLowerCase(); if (s.indexOf(SF.q.toLowerCase()) < 0) return false; }
      return true;
    });
    tw.innerHTML = "";
    var t = el("table"); t.appendChild(el("thead", null, [el("tr", null, [el("th", { text: "Screen" }), el("th", { text: "Title" }), el("th", { class: "num", text: "Width" }), el("th", { class: "num", text: "Ways in" }), el("th", { class: "num", text: "Links out" }), el("th", { text: "Figma" })])]));
    var tb = el("tbody");
    rows.forEach(function (f) {
      var inc = (m.incoming[f.id] || []).length, out = (m.out[f.id] || []).filter(function (e) { return !e.nav; }).length;
      tb.appendChild(el("tr", null, [el("td", null, [el("code", { text: f.id }), document.createTextNode(" " + code(f))]), el("td", { text: f.title }), el("td", { class: "num", text: f.w }),
        el("td", { class: "num", style: inc ? "" : "color:var(--bad);font-weight:600", text: String(inc) }), el("td", { class: "num", text: String(out) }), el("td", null, [el("a", { href: figmaUrl(f.id), target: "_blank", rel: "noopener", text: "Open ↗" })])]));
    });
    t.appendChild(tb); tw.appendChild(t);
    tw.insertBefore(el("div", { class: "notice", style: "border-radius:12px 12px 0 0", text: rows.length + " of " + Object.keys(m.frames).length + " screens" }), t);
  }
  q.addEventListener("input", function () { SF.q = q.value; draw(); }); ps.addEventListener("change", function () { SF.page = ps.value; draw(); });
  ws.addEventListener("change", function () { SF.width = ws.value; draw(); }); oc.addEventListener("change", function () { SF.orphan = oc.checked; draw(); });
  v.appendChild(bar); v.appendChild(tw); draw();
}

/* ---------- rendering: changes ---------- */
function renderChanges() {
  var v = document.getElementById("view-changes"); v.innerHTML = "";
  if (!S.data) { v.appendChild(el("div", { class: "panel empty", text: "No extraction yet." })); return; }
  if (!S.prev) { v.appendChild(el("div", { class: "panel empty", text: "This is the first extraction. After the next refresh this view lists screens and links that were added, removed or renamed." })); return; }
  var a = S.prev, b = S.data;
  var added = Object.keys(b.frames).filter(function (id) { return !a.frames[id]; }), removed = Object.keys(a.frames).filter(function (id) { return !b.frames[id]; });
  var renamed = Object.keys(b.frames).filter(function (id) { return a.frames[id] && (a.frames[id].title !== b.frames[id].title || a.frames[id].name !== b.frames[id].name); });
  var key = function (e) { return e.from + ">" + e.to + ">" + e.label; };
  var ak = {}, bk = {}; a.edges.forEach(function (e) { ak[key(e)] = e; }); b.edges.forEach(function (e) { bk[key(e)] = e; });
  var eAdd = Object.keys(bk).filter(function (k) { return !ak[k] && !bk[k].nav; }), eRem = Object.keys(ak).filter(function (k) { return !bk[k] && !ak[k].nav; });
  var fixedOrphans = a.orphans.filter(function (id) { return b.frames[id] && b.incoming[id]; });
  v.appendChild(el("p", { class: "snapinfo", text: "Comparing " + fmtDate(S.snaps[0].at) + " with " + fmtDate(S.snaps[1].at) + ". Navigation-only links are left out." }));
  var grid = el("div", { class: "diffgrid" });
  function box(title, items, fmt) { var p = el("div", { class: "panel" }, [el("h3", { text: title + " · " + items.length })]); var ul = el("ul"); items.slice(0, 200).forEach(function (x) { ul.appendChild(el("li", null, [fmt(x)])); }); if (!items.length) ul.appendChild(el("li", { style: "list-style:none;color:var(--muted)", text: "None" })); p.appendChild(ul); return p; }
  function fr(m) { return function (id) { var f = m.frames[id]; return el("span", null, [el("a", { href: figmaUrl(id), target: "_blank", rel: "noopener", text: id }), document.createTextNode(" " + (f ? code(f) + " · " + f.title : ""))]); }; }
  function ed(map, m) { return function (k) { var e = map[k], fa = m.frames[e.from], fb = m.frames[e.to]; return el("span", { text: (fa ? code(fa) + " " + fa.w : e.from) + " → " + (fb ? code(fb) + " " + fb.w : e.to) + " · " + e.label }); }; }
  grid.appendChild(box("New screens", added, fr(b))); grid.appendChild(box("Removed screens", removed, fr(a)));
  grid.appendChild(box("Renamed or retitled", renamed, function (id) { return el("span", null, [el("code", { text: id }), document.createTextNode(" " + a.frames[id].title + " → " + b.frames[id].title)]); }));
  grid.appendChild(box("Screens that gained a way in", fixedOrphans, fr(b)));
  grid.appendChild(box("New action links", eAdd, ed(bk, b))); grid.appendChild(box("Removed action links", eRem, ed(ak, a)));
  v.appendChild(grid);
}

/* ---------- tabs ---------- */
function setTab(t) {
  S.tab = t;
  ["overview", "journeys", "screens", "changes"].forEach(function (x) { document.getElementById("tab-" + x).setAttribute("aria-selected", x === t ? "true" : "false"); document.getElementById("view-" + x).hidden = x !== t; });
  try { localStorage.setItem("cb-flow-tab", t); } catch (e) {}
  renderAll();
}
function renderAll() {
  if (S.tab === "overview") renderOverview(); else if (S.tab === "journeys") renderJourneys(); else if (S.tab === "screens") renderScreens(); else renderChanges();
  var info = document.getElementById("snapinfo");
  if (S.snaps[0]) info.textContent = "Extracted from Figma " + fmtDate(S.snaps[0].at) + " · " + Object.keys(S.data.frames).length + " screens · " + S.data.edges.length + " links" + (S.snaps[0].source === "seed" ? " · first extraction made by Claude" : "") + (S.snaps[0].lastModified ? " · Figma file last edited " + fmtDate(S.snaps[0].lastModified) : "");
}
document.querySelectorAll("nav.tabs button").forEach(function (b) { b.addEventListener("click", function () { setTab(b.getAttribute("data-tab")); }); });

/* ---------- data ---------- */
function showStatus(kind, text) {
  var box = document.getElementById("refreshStatus"); box.hidden = false; box.innerHTML = "";
  box.appendChild(el("div", { class: "notice " + (kind || ""), role: "status", text: text }));
}
function getJson(name) {
  return fetch("data/" + name + "?t=" + Date.now(), { cache: "no-store" }).then(function (r) { if (r.status === 404) return null; if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); });
}
function loadLatest() {
  return getJson("latest.json").then(function (latest) {
    return latest && latest.hasPrevious ? getJson("previous.json").catch(function () { return null; }).then(function (prev) { return [latest, prev]; }) : [latest, null];
  }).then(function (r) {
    var latest = r[0], prev = r[1];
    if (!latest || !latest.pages) { S.snaps = []; S.data = null; document.getElementById("snapinfo").textContent = "No extraction published yet. Run the refresh workflow once."; renderAll(); return; }
    S.snaps = [latest].concat(prev && prev.pages ? [prev] : []);
    S.data = buildModel(latest.pages); S.prev = prev && prev.pages ? buildModel(prev.pages) : null;
    if (latest.missingPages && latest.missingPages.length) showStatus("bad", "These Figma pages were not found in the last refresh: " + latest.missingPages.join(", ") + ".");
    renderAll();
  }).catch(function (e) { showStatus("bad", "Could not load data/latest.json (" + (e && e.message || e) + ")."); });
}
/* ---------- boot ---------- */
try { var saved = localStorage.getItem("cb-flow-tab"); if (saved) S.tab = saved; } catch (e) {}
setTab(S.tab);
(function linkRefresh() {
  // On <owner>.github.io/<repo>/ the button opens the workflow page, where "Run workflow" starts a refresh.
  var m = /^([a-z0-9-]+)\.github\.io$/i.exec(location.hostname);
  var repo = location.pathname.split("/").filter(Boolean)[0];
  if (m && repo) { var b = document.getElementById("refreshBtn"); b.href = "https://github.com/" + m[1] + "/" + repo + "/actions/workflows/refresh.yml"; b.hidden = false; b.title = "Opens GitHub. Press 'Run workflow'; the page updates about two minutes later."; }
})();
loadLatest();
})();
</script>
